name: 编译检查

on:
  push:
    paths:
      - "**.ino"
      - "**.h"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "**.ino"
      - "**.h"
      - ".github/workflows/**"

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/compile-sketches@v1
        with:
          platforms: |
            - name: esp32:esp32
              source: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          fqbn: esp32:esp32:esp32s3:CDCOnBoot=cdc
          libraries: |
            - name: GxEPD2
              version: 1.6.9
          sketch-paths: |
            - codex_display_demo
            - wb_quota_display
            - wb_serial_display
